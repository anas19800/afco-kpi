<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AFCO KPI Dashboard</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #f5f7fa;
        --card-bg: #ffffffaa;
        --text: #1b1f24;
        --muted: #5f6b7a;
        --border: rgba(27, 31, 36, 0.08);
        --success: #0f9960;
        --warning: #d9822b;
        --danger: #c23030;
        --neutral: #d1d5db;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #f0f4ff 0%, #fef6e4 100%);
        color: var(--text);
        padding: 32px clamp(16px, 6vw, 64px);
        box-sizing: border-box;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 32px;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 40px);
        letter-spacing: -0.02em;
      }

      p.subtitle {
        margin: 0;
        color: var(--muted);
        font-size: clamp(14px, 2.4vw, 18px);
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 18px;
        margin-bottom: 40px;
      }

      .kpi-card {
        background: var(--card-bg);
        border-radius: 18px;
        border: 1px solid var(--border);
        padding: 20px 22px;
        box-shadow: 0 18px 36px rgba(31, 41, 55, 0.1);
        backdrop-filter: blur(8px);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .kpi-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 24px 45px rgba(31, 41, 55, 0.12);
      }

      .kpi-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        color: var(--muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 11px;
      }

      .kpi-value {
        font-size: clamp(30px, 6vw, 42px);
        font-weight: 700;
        margin: 0 0 6px;
      }

      .kpi-target {
        color: var(--muted);
        font-size: 14px;
        margin: 0;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        font-size: 12px;
        padding: 4px 10px;
        font-weight: 600;
        background: rgba(0, 0, 0, 0.08);
        color: inherit;
      }

      .badge svg {
        width: 14px;
        height: 14px;
      }

      .badge.success {
        color: var(--success);
        background: rgba(15, 153, 96, 0.12);
      }

      .badge.warning {
        color: var(--warning);
        background: rgba(217, 130, 43, 0.14);
      }

      .badge.danger {
        color: var(--danger);
        background: rgba(194, 48, 48, 0.14);
      }

      .heatmap {
        background: var(--card-bg);
        border-radius: 20px;
        border: 1px solid var(--border);
        overflow-x: auto;
        box-shadow: 0 18px 36px rgba(31, 41, 55, 0.08);
        backdrop-filter: blur(8px);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 760px;
      }

      thead th {
        position: sticky;
        top: 0;
        backdrop-filter: blur(8px);
        background: rgba(255, 255, 255, 0.92);
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 700;
        padding: 14px 16px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }

      tbody td {
        padding: 14px 16px;
        border-bottom: 1px solid rgba(27, 31, 36, 0.05);
        font-size: 15px;
        vertical-align: middle;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      tbody td:first-child {
        font-weight: 600;
      }

      .cell {
        border-radius: 12px;
        padding: 10px 12px;
        text-align: center;
        font-weight: 600;
      }

      .cell.neutral {
        background: rgba(209, 213, 219, 0.36);
        color: #111827;
      }

      .cell.success {
        background: rgba(15, 153, 96, 0.18);
        color: #03543f;
      }

      .cell.warning {
        background: rgba(217, 130, 43, 0.2);
        color: #7a2e0c;
      }

      .cell.danger {
        background: rgba(194, 48, 48, 0.2);
        color: #7f1d1d;
      }

      footer {
        margin-top: 40px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      @media (max-width: 640px) {
        body {
          padding: 24px 18px;
        }

        .kpi-grid {
          grid-template-columns: 1fr;
        }

        table {
          min-width: 640px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>AFCO KPI Dashboard</h1>
        <p class="subtitle">Snapshot of operational performance across the kingdom.</p>
      </div>
      <div class="badge success" id="publishStatus" aria-live="polite"></div>
    </header>

    <section class="kpi-grid" id="kpiGrid"></section>

    <section class="heatmap" aria-labelledby="heatmapHeading">
      <table>
        <thead>
          <tr id="heatmapHeading">
            <th>City</th>
            <th>On-Time Arrival</th>
            <th>Customer Satisfaction</th>
            <th>Fuel Efficiency</th>
            <th>Turnaround Time</th>
          </tr>
        </thead>
        <tbody id="heatmapBody"></tbody>
      </table>
    </section>

    <footer>
      Updated automatically from static data. Last refreshed <span id="refreshedAt"></span>.
    </footer>

    <script>
      const formatValue = (value, unit) => {
        if (value === null || value === undefined || value === "") return "—";
        const number = typeof value === "number" ? value : parseFloat(value);
        if (Number.isNaN(number)) return String(value);
        switch (unit) {
          case "percentage":
            return `${number.toFixed(1)}%`;
          case "sar":
            return `${number.toLocaleString("en-SA", { style: "currency", currency: "SAR", maximumFractionDigits: 0 })}`;
          case "hours":
            return `${number.toFixed(1)} hrs`;
          case "count":
            return number.toLocaleString();
          default:
            return `${number}`;
        }
      };

      const determineBand = (actual, bands, direction) => {
        if (!Array.isArray(bands) || typeof actual !== "number") return "neutral";
        const sortedBands = [...bands].sort((a, b) => a.threshold - b.threshold);
        if (direction === "HIGHER_IS_BETTER") {
          for (let i = sortedBands.length - 1; i >= 0; i -= 1) {
            if (actual >= sortedBands[i].threshold) {
              return sortedBands[i].level.toLowerCase();
            }
          }
        } else {
          for (let i = 0; i < sortedBands.length; i += 1) {
            if (actual <= sortedBands[i].threshold) {
              return sortedBands[i].level.toLowerCase();
            }
          }
        }
        return "neutral";
      };

      const sample = {
        publishedAt: "2024-04-12T11:30:00Z",
        kpis: [
          {
            id: "ota",
            title: "On-Time Arrival",
            direction: "HIGHER_IS_BETTER",
            unit: "percentage",
            target: 93,
            actual: 95.2,
            bands: [
              { level: "Danger", threshold: 86 },
              { level: "Warning", threshold: 90 },
              { level: "Success", threshold: 94 }
            ]
          },
          {
            id: "csat",
            title: "Customer Satisfaction",
            direction: "HIGHER_IS_BETTER",
            unit: "percentage",
            target: 90,
            actual: 88.4,
            bands: [
              { level: "Danger", threshold: 84 },
              { level: "Warning", threshold: 87 },
              { level: "Success", threshold: 92 }
            ]
          },
          {
            id: "fuel",
            title: "Fuel Efficiency",
            direction: "LOWER_IS_BETTER",
            unit: "percentage",
            target: 4.8,
            actual: 5.3,
            bands: [
              { level: "Success", threshold: 4.6 },
              { level: "Warning", threshold: 5.1 },
              { level: "Danger", threshold: 5.4 }
            ]
          },
          {
            id: "turnaround",
            title: "Turnaround Time",
            direction: "LOWER_IS_BETTER",
            unit: "hours",
            target: 2.5,
            actual: 2.1,
            bands: [
              { level: "Success", threshold: 2.2 },
              { level: "Warning", threshold: 2.5 },
              { level: "Danger", threshold: 2.9 }
            ]
          }
        ],
        cities: [
          {
            city: "Riyadh",
            metrics: {
              ota: 96.1,
              csat: 90.2,
              fuel: 5.0,
              turnaround: 2.4
            }
          },
          {
            city: "Jeddah",
            metrics: {
              ota: 92.8,
              csat: 86.4,
              fuel: 5.5,
              turnaround: 2.7
            }
          },
          {
            city: "Dammam",
            metrics: {
              ota: 94.4,
              csat: 89.7,
              fuel: 5.2,
              turnaround: 2.3
            }
          },
          {
            city: "Madinah",
            metrics: {
              ota: 93.6,
              csat: 87.9,
              fuel: 5.4,
              turnaround: 2.8
            }
          }
        ]
      };

      const kpiGrid = document.getElementById("kpiGrid");
      const heatmapBody = document.getElementById("heatmapBody");
      const status = document.getElementById("publishStatus");
      const refreshed = document.getElementById("refreshedAt");

      const badgeIcons = {
        success: "M5 13l4 4L19 7",
        warning: "M12 8v4m0 4h.01",
        danger: "M6.343 6.343l11.314 11.314",
        neutral: "M6 18L18 6M6 6l12 12"
      };

      const createBadge = (band) => {
        const svgPath = badgeIcons[band] || badgeIcons.neutral;
        return `
          <span class="badge ${band}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="${svgPath}" />
            </svg>
            ${band === "success" ? "On Track" : band === "warning" ? "Watch" : band === "danger" ? "At Risk" : "Status"}
          </span>
        `;
      };

      sample.kpis.forEach((kpi) => {
        const band = determineBand(kpi.actual, kpi.bands, kpi.direction);
        const card = document.createElement("article");
        card.className = "kpi-card";
        card.innerHTML = `
          <div class="kpi-header">
            <span>${kpi.title}</span>
            ${createBadge(band)}
          </div>
          <p class="kpi-value">${formatValue(kpi.actual, kpi.unit)}</p>
          <p class="kpi-target">Target: ${formatValue(kpi.target, kpi.unit)}</p>
        `;
        kpiGrid.appendChild(card);
      });

      sample.cities.forEach((city) => {
        const row = document.createElement("tr");
        row.innerHTML = `<td>${city.city}</td>`;
        sample.kpis.forEach((kpi) => {
          const value = city.metrics[kpi.id];
          const band = determineBand(value, kpi.bands, kpi.direction);
          const cell = document.createElement("td");
          cell.innerHTML = `<div class="cell ${band}">${formatValue(value, kpi.unit)}</div>`;
          row.appendChild(cell);
        });
        heatmapBody.appendChild(row);
      });

      const publishedDate = new Date(sample.publishedAt);
      const formatter = new Intl.DateTimeFormat("en-SA", {
        dateStyle: "medium",
        timeStyle: "short"
      });
      status.textContent = `Static snapshot published ${formatter.format(publishedDate)}`;
      refreshed.textContent = formatter.format(new Date());
    </script>
  </body>
</html>
